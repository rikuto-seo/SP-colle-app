</style></head><body><header><div class="brand"><b>SP</b> Colle</div><div class="category">募集を公開する</div></header><div class="copy"><h1>入口は、下部メニューの<br>「トレード」。</h1><p class="lead">ログイン後、利用するグループを選んで始めます。</p><div class="steps"><section><h2>画面下の「トレード」を開く</h2><p>PCでは上部メニューの「トレード」から開けます。</p></section><section><h2>右上の「＋ 募集する」を押す</h2><p>交換に出す写真と、その写真で欲しい写真を設定する画面へ進みます。</p></section><section><h2>譲る写真は、先に所持登録</h2><p>まだ登録していない写真は、下部の「追加」から写真・所持枚数を登録してください。</p></section></div><p class="note">公開した募集は「自分の募集」から、いつでも確認できます。</p></div><div class="screens single"><figure><figcaption>ここから募集を作成</figcaption><div class="phone"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAwwAAAaYCAIAAACl0szeAAAQAElEQVR4nOzdDVxT9f4H8J8wHBM2BRkP8qSAKFMkRAWFK5So6A2vmJJJalfNNPOmZWXZzeymWVnW30wztXxM0SsmXkXFggIFFQnRgTiQR3kYgm7gNhnzf87GM2cwFN3Az/tFtp1zdvYI57Pv7+GwHjx4QAAAAACgORYBAAAAgFYQkgAAAAAYICQBAAAAMEBIAgAAAGCAkAQAAADAACEJAAAAgAFCEgAAAAADhCQAAAAABghJAAAAAAwQkgAAAAAYICQBAAAAMEBIAgAAAGCAkAQAAADAACEJAAAAgAFCEgAAAAADhCQAAAAABghJAAAAAAwQkgAAAAAYICQBAAAAMEBIAgAAAGCAkAQAAADAACEJAAAAgAFCEgAAAAADhCQAAAAABghJAAAAAAwQkgAAAAAYICQBAAAAMEBIAgAAAGCAkAQAAADAACEJAAAAgAFCEgAAAAADhCQAAICnzv37NTU1Surf2tpalUr1gEYeqx49qJ8eRkZGxsbGPXuamJiwqH+JYevx2F8VAAAAMAxUJLp3Ty6XK6hoRPTN2NjI1JTdq5cpFZuIQUJIAgAA6P6oalFVVTWVkDRXWSxjNpuq57AoVFihajzk8aMiBxXOlEolVcRSKO4rlbWa5VROMjc3MzJ6Eo+hQxCSAAAAujmZTC6VVlM5ibrM4ZhyOGxDaOqiGvtkMgX12KjLVELics2ox0YMCUISAABAdyaRVGkKSFTblrl5L6pyRAwJVU+qqqKaABVEXVLi8cyJwUBIAgAA6LYqKyVUwxZ1gQofVAQhhoqKcVSYoy5QjYAWFjxiGBCSAAAAuidNQjI2Nurdm2v4Q8mo1re7d6W1tSrDyUkISQYvb2foc58Lmy4J25a9IVCntQAA8LTStLJRCcnCorehNbFpQzW9VVbepXKSgbS7GREAAADoXmQyuaYfElVD6ioJiajH3FEPmKhb3zQduvXLkCaTvF9enHiu4o+rsqvltWIZqa1fbs4xMjczGTrEbKJ3X69BlpzGW+R/urj4VJv7NDYx4vembxvq7+DlyOmMz4lCkn05OvpYQtJ5YXZZoURRv5xt4WDNd/AOCAyZMiVIYMXuMp9JAADoVlSqB1JpNVH3QzL8VrYWqAdMPWyqDEY9BTabrd95AQwjJN0vyd30Q2l0SWMwaqpKpqqSKUriFbHxFQMnue2c0pforLZGVVJed9uePM7S1zymujz050WRd/rrD9ZsTypnXltZWED9ZCUd2/m5YOXZ6FcdCAAAwBNXVUWP9tfM00i6IOph379fI5crqCei30Y3/YekWnH8tdcOyMTk
