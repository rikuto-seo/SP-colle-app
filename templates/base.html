<!DOCTYPE html>
<html lang="ja" data-bs-theme="{{ 'dark' if current_user.is_authenticated and current_user.dark_mode else 'light' }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SP Colle | 坂道グループ 生写真アプリ{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="apple-mobile-web-app-title" content="SP Colle">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- OGP -->
    <meta property="og:title" content="SP Colle | 坂道グループ 生写真アプリ">
    <meta property="og:description" content="坂道グループの生写真を管理・記録できるアプリ">
    <meta property="og:image" content="https://spcolle.com/static/images/ogp-v2.png">
    <meta property="og:url" content="https://spcolle.com/">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SP Colle | 坂道グループ 生写真アプリ">
    <meta name="twitter:description" content="坂道グループの生写真を管理・記録できるアプリ">
    <meta name="twitter:image" content="https://spcolle.com/static/images/ogp-v2.png">
    <meta name="csrf-token" content="{{ csrf_token() }}">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T328YZ27CL"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-T328YZ27CL');
    </script>

    <link rel="icon" href="{{ url_for('static', filename='images/icon-192.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block head %}{% endblock %}
</head>

{% set surface = 'app' %}
<body class="app-shell{% if current_user.is_authenticated and current_user.dark_mode %} dark-mode{% endif %}{% if current_user.is_authenticated and group_key and not force_select_mode %} has-mobile-nav{% endif %}" data-group="{{ group_key | default('') }}">
    {% include '_site_header.html' %}
    <main id="main-content" class="container app-main" tabindex="-1">
        {% block content %}{% endblock %}
    </main>
    {% include '_site_footer.html' %}
    <button id="scrollTopBtn" class="scroll-top-btn" type="button" aria-label="ページの先頭へ" hidden><i class="fas fa-arrow-up" aria-hidden="true"></i></button>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/site.js') }}"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js');
            });
        }
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

            document.querySelectorAll("form").forEach(form => {
                if ((form.getAttribute("method") || "get").toLowerCase() === "post") {

                    // すでにある場合はスキップ
                    if (form.querySelector('input[name="csrf_token"]')) return;

                    const input = document.createElement("input");
                    input.type = "hidden";
                    input.name = "csrf_token";
                    input.value = csrfToken;

                    form.appendChild(input);
                }
            });
        });
    </script>

    <script>
        const originalFetch = window.fetch;

        window.fetch = function (url, options = {}) {

            const urlString =
                typeof url === "string" ? url : url.url;

            // 自サイト以外には何もしない
            const isExternal =
                urlString.startsWith("http") &&
                !urlString.startsWith(window.location.origin);

            if (isExternal) {
                return originalFetch(url, options);
            }

            const method =
                (options.method || "GET").toUpperCase();

            if (method !== "GET") {

                const csrfToken =
                    document.querySelector(
                        'meta[name="csrf-token"]'
                    ).content;

                if (options.body instanceof FormData) {

                    options.body.append(
                        "csrf_token",
                        csrfToken
                    );

                } else {

                    options.headers = {
                        ...(options.headers || {}),
                        "X-CSRFToken": csrfToken
                    };

                }
            }

            return originalFetch(url, options);
        };
    </script>

    {% block scripts %}{% endblock %}

</body>
</html>
