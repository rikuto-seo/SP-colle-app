<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}坂道グループ 生写真アプリ{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

    <meta name="apple-mobile-web-app-title" content="坂道生写真">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <style>
        body {
            font-family: 'Noto Serif JP', serif;
            overflow-x: hidden;
        }

        .container {
            padding: 1rem;
        }

        .bg-hinata { background-color: #d4f4ff !important; }
        .bg-sakura { background-color: #f9d6e5 !important; }
        .bg-nogi   { background-color: #e4dcf1 !important; }
        .bg-default { background-color: #eaf4fc !important; }

        .navbar-hinata {
            background-color: #00bcd4 !important;
            color: white !important;
        }

        .navbar-sakura {
            background-color: #880e4f !important;
            color: white !important;
        }

        .navbar-nogi {
            background-color: #6f42c1 !important;
            color: white !important;
        }

        .navbar-default {
            background-color: #fffff9 !important;
            color: black !important;
        }

        .navbar-hinata #menu-button,
        .navbar-sakura #menu-button,
        .navbar-nogi #menu-button {
            color: white;
        }

        .navbar-default #menu-button {
            color: black;
        }

        #menu-button {
            font-size: 24px;
            background: transparent;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }

        #sidebar {
            position: fixed;
            top: 0;
            width: 200px;
            max-width: 70vw;
            height: 100%;
            background-color: #ffffff;
            box-shadow: 2px 0 5px rgba(0,0,0,0.3);
            padding: 20px;
            transition: transform 0.3s ease;
            z-index: 9999;
            box-sizing: border-box;
            overflow-x: hidden;
            transform: translateX(-100%);
        }

        #sidebar.open {
            transform: translateX(0);
        }

        #sidebar a {
            display: block;
            margin: 10px 0;
            font-size: 18px;
            font-family: 'Arial', sans-serif;
            text-decoration: none;
            color: #333;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        #sidebar a:hover {
            background-color: #a3d4f7;
            color: white;
        }

        #sidebar h3 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        #back-to-top {
            position: fixed;
            bottom: 40px;
            right: 20px;
            z-index: 9999;
            background-color: rgba(163, 212, 247, 0.8);
            color: #fff;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: none;
            transition: opacity 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        #back-to-top:hover {
            background-color: rgba(163, 212, 247, 1.0);
        }

        .photo-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
        }

        .photo-item {
            text-align: center;
            width: 150px;
            max-width: 100%;
        }

        .photo-item img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
        }

        .missing-photo {
            filter: grayscale(100%) brightness(80%);
            opacity: 0.7;
        }

        .photo-info {
            margin-top: 8px;
            font-size: 0.9em;
            color: #555;
        }

        .logout-icon {
            color: red;
        }

        .section-title {
            border-bottom: 3px solid orange;
        }

        @media (max-width: 768px) {
            .photo-item {
                width: 45%;
            }

            #sidebar {
                width: 50%;
            }

            #sidebar h3 {
                font-size: 20px;
            }

            #sidebar a {
                font-size: 16px;
            }

            .navbar-hinata,
            .navbar-sakura,
            .navbar-nogi,
            .navbar-default {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>

<body class="{{ group_color }}">

    <div class="{% if group_key == 'hinatazaka' %}navbar-hinata
        {% elif group_key == 'sakurazaka' %}navbar-sakura
        {% elif group_key == 'nogizaka' %}navbar-nogi
        {% else %}navbar-default{% endif %} p-3 d-flex justify-content-between align-items-center flex-wrap">

        <button id="menu-button">☰</button>
        <div style="font-size: 20px; font-weight: bold;">
            坂道グループ 生写真アプリ
        </div>
        <div style="width: 40px;"></div>
    </div>

    <div id="sidebar">
        <h3>メニュー</h3>
        <a href="{{ url_for('index', group_key=group_key) }}">
            <i class="fas fa-camera"></i> 生写真一覧
        </a>
        <a href="{{ url_for('add', group_key=group_key) }}">
            <i class="fas fa-plus-circle"></i> 新規追加
        </a>
        <a href="{{ url_for('stats', group_key=group_key) }}">
            <i class="fas fa-chart-bar"></i> 統計を見る
        </a>
        <a href="{{ url_for('missing', group_key=group_key) }}">
            <i class="fas fa-box-open"></i> 未所持リスト
        </a>
        <a href="{{ url_for('gallery', group_key=group_key) }}">
            <i class="fas fa-image"></i> ギャラリー
        </a>
        <hr>
        <h3>グループ切替</h3>
        <a href="{% if endpoint == 'shared_collection' and username %}
             {{ url_for(endpoint, group_key='nogizaka', username=username) }}
         {% else %}
             {{ url_for(endpoint, group_key='nogizaka') }}
         {% endif %}">乃木坂46</a>
        <a href="{% if endpoint == 'shared_collection' and username %}
                    {{ url_for(endpoint, group_key='sakurazaka', username=username) }}
                {% else %}
                    {{ url_for(endpoint, group_key='sakurazaka') }}
                {% endif %}">櫻坂46</a>

        <a href="{% if endpoint == 'shared_collection' and username %}
                    {{ url_for(endpoint, group_key='hinatazaka', username=username) }}
                {% else %}
                    {{ url_for(endpoint, group_key='hinatazaka') }}
                {% endif %}">日向坂46</a>
        <a href="{{ url_for('logout') }}">
            <i class="fas fa-sign-out-alt logout-icon"></i> ログアウト
        </a>
    </div>

    <div class="container mt-4 {{ group_color }}">
        {% block content %}
        {% endblock %}
    </div>

    <button id="back-to-top" title="上へ戻る">⬆</button>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const menuBtn = document.getElementById("menu-button");
            const sidebar = document.getElementById("sidebar");

            if (!menuBtn || !sidebar) {
                console.error("menu-button または sidebar が見つかりません");
                return;
            }

            menuBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                sidebar.classList.toggle("open");
            });

            document.addEventListener("click", (e) => {
                if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
                    sidebar.classList.remove("open");
                }
            });

            const backToTopBtn = document.getElementById("back-to-top");

            window.addEventListener("scroll", () => {
                if (window.scrollY > 200) {
                    backToTopBtn.style.display = "block";
                } else {
                    backToTopBtn.style.display = "none";
                }
            });

            backToTopBtn.addEventListener("click", () => {
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });
        });
    </script>
</body>
</html>
