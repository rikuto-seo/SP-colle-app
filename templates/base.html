<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}坂道グループ 生写真アプリ{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

    <meta name="apple-mobile-web-app-title" content="坂道生写真">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
</head>

<body class="{{ group_color }}{% if current_user.is_authenticated and current_user.dark_mode %} dark-mode{% endif %}">

    <div class="{% if group_key == 'hinatazaka' %}navbar-hinata
        {% elif group_key == 'sakurazaka' %}navbar-sakura
        {% elif group_key == 'nogizaka' %}navbar-nogi
        {% else %}navbar-default{% endif %} p-3 d-flex justify-content-between align-items-center flex-wrap">

        <button id="menu-button">☰</button>
        <div style="font-size: 20px; font-weight: bold;">
            坂道グループ 生写真アプリ
        </div>
        <div style="width: 40px;"></div>
    </div>

    <div id="sidebar">
        <div class="sidebar-main">
            <h3>メニュー</h3>
            {% if group_key is defined and group_key %}
            <a href="{{ url_for('index', group_key=group_key) }}">
                <i class="fas fa-camera"></i> 生写真一覧
            </a>
            <a href="{{ url_for('add', group_key=group_key) }}">
                <i class="fas fa-plus-circle"></i> 新規追加
            </a>
            <a href="{{ url_for('stats', group_key=group_key) }}">
                <i class="fas fa-chart-bar"></i> 統計を見る
            </a>
            <a href="{{ url_for('missing', group_key=group_key) }}">
                <i class="fas fa-box-open"></i> 未所持リスト
            </a>
            <a href="{{ url_for('gallery', group_key=group_key) }}">
                <i class="fas fa-image"></i> ギャラリー
            </a>
            <a href="{{ url_for('want.index', group_key=group_key) }}">
                <i class="fas fa-heart"></i> 欲しい生写真
            </a>

            {% else %}
            <span class="text-muted"><i class="fas fa-camera"></i> 生写真一覧</span>
            <span class="text-muted"><i class="fas fa-plus-circle"></i> 新規追加</span>
            <span class="text-muted"><i class="fas fa-chart-bar"></i> 統計を見る</span>
            <span class="text-muted"><i class="fas fa-box-open"></i> 未所持リスト</span>
            <span class="text-muted"><i class="fas fa-image"></i> ギャラリー</span>
            <span class="text-muted"><i class="fas fa-heart"></i> 欲しい生写真</span>

            {% endif %}

            <hr>

            <h3>グループ切替</h3>
            <a
                href="{% if endpoint == 'shared_collection' and username %}{{ url_for(endpoint, group_key='nogizaka', username=username) }}{% else %}{{ url_for(endpoint, group_key='nogizaka') }}{% endif %}">乃木坂46</a>
            <a
                href="{% if endpoint == 'shared_collection' and username %}{{ url_for(endpoint, group_key='sakurazaka', username=username) }}{% else %}{{ url_for(endpoint, group_key='sakurazaka') }}{% endif %}">櫻坂46</a>
            <a
                href="{% if endpoint == 'shared_collection' and username %}{{ url_for(endpoint, group_key='hinatazaka', username=username) }}{% else %}{{ url_for(endpoint, group_key='hinatazaka') }}{% endif %}">日向坂46</a>
        </div>

        <div class="sidebar-footer">
            <a href="{{ url_for('mypage') }}">
                <img src="{{ current_user.icon_url or url_for('static', filename='img/default_icon.png') }}"
                    alt="ユーザーアイコン"
                    style="width: 32px; height: 32px; object-fit: cover; border-radius: 50%; margin-right: 8px;">
                マイページ
            </a>
        </div>
    </div>

    <div class="container mt-4 {{ group_color }}">
        {% block content %}
        {% endblock %}
    </div>

    <button id="back-to-top" title="上へ戻る">⬆</button>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const menuBtn = document.getElementById("menu-button");
            const sidebar = document.getElementById("sidebar");

            if (!menuBtn || !sidebar) {
                console.error("menu-button または sidebar が見つかりません");
                return;
            }

            menuBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                sidebar.classList.toggle("open");
            });

            document.addEventListener("click", (e) => {
                if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) {
                    sidebar.classList.remove("open");
                }
            });

            const backToTopBtn = document.getElementById("back-to-top");

            window.addEventListener("scroll", () => {
                if (window.scrollY > 200) {
                    backToTopBtn.style.display = "block";
                } else {
                    backToTopBtn.style.display = "none";
                }
            });

            backToTopBtn.addEventListener("click", () => {
                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            });
        });
    </script>
</body>

</html>
