<!DOCTYPE html>
<html lang="ja" data-bs-theme="{{ 'dark' if current_user.is_authenticated and current_user.dark_mode else 'light' }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}生写真データベース | SP Colle{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/icon-192.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="apple-mobile-web-app-title" content="SP Colle">

    <!-- OGP -->
    <meta property="og:title" content="{% block og_title %}生写真データベース | SP Colle{% endblock %}">
    <meta property="og:description" content="{% block og_description %}乃木坂46・櫻坂46・日向坂46の生写真(衣装・種類・参加メンバー)をだれでも検索できます。{% endblock %}">
    <meta property="og:image" content="https://spcolle.com/static/images/ogp-v2.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ self.og_title() }}">
    <meta name="twitter:description" content="{{ self.og_description() }}">
    <meta name="twitter:image" content="https://spcolle.com/static/images/ogp-v2.png">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T328YZ27CL"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-T328YZ27CL');
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">


    {% block head %}{% endblock %}
</head>

{% set surface = surface | default('catalog') %}
{% set group_key = group.key if group else '' %}
<body class="{{ 'landing-shell' if surface == 'landing' else 'catalog-shell' }}{% if current_user.is_authenticated and current_user.dark_mode %} dark-mode{% endif %}" data-group="{{ group_key }}">
    {% include '_site_header.html' %}
    <main id="main-content" class="{% block main_class %}container app-main catalog-main{% endblock %}" tabindex="-1">
        {% block content %}{% endblock %}
    </main>
    {% include '_site_footer.html' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/site.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
