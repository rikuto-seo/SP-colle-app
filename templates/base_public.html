<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}生写真データベース | SP Colle{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <link rel="icon" href="{{ url_for('static', filename='images/icon-192.png') }}">

    <!-- OGP -->
    <meta property="og:title" content="{% block og_title %}生写真データベース | SP Colle{% endblock %}">
    <meta property="og:description" content="乃木坂46・櫻坂46・日向坂46の生写真(衣装・種類・参加メンバー)をだれでも検索できます。">
    <meta property="og:image" content="https://spcolle.com/static/images/ogp.png">
    <meta property="og:type" content="website">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T328YZ27CL"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-T328YZ27CL');
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>

    {% block head %}{% endblock %}
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand px-3 py-2
        {% if group and group.key == 'hinatazaka' %}navbar-hinata
        {% elif group and group.key == 'sakurazaka' %}navbar-sakura
        {% elif group and group.key == 'nogizaka' %}navbar-nogi
        {% else %}navbar-default{% endif %}">
        <div class="container-fluid px-0">
            <a href="{{ url_for('public_catalog.index') }}" class="navbar-brand fw-bold mb-0">
                <i class="fas fa-camera"></i> SP Colle DB
            </a>

            <a href="{{ url_for('auth.login') }}" class="btn btn-sm btn-light fw-bold">
                無料登録してトレードを始める
            </a>
        </div>
    </nav>

    <div class="container my-4
        {% if group and group.key == 'hinatazaka' %}bg-hinata
        {% elif group and group.key == 'sakurazaka' %}bg-sakura
        {% elif group and group.key == 'nogizaka' %}bg-nogi
        {% endif %}"
        style="border-radius:1rem;{% if group %}padding-top:1.5rem;padding-bottom:1.5rem;{% endif %}">
        {% block content %}{% endblock %}
    </div>

    <footer class="app-footer mt-5 py-4 border-top">
        <div class="container text-center">

            <div class="mb-2">
                <a href="{{ url_for('core.terms') }}">利用規約</a>
                <span class="mx-2">|</span>
                <a href="{{ url_for('core.privacy') }}">プライバシーポリシー</a>
                <span class="mx-2">|</span>
                <a href="{{ url_for('core.legal') }}">特定商取引法表示</a>
                <span class="mx-2">|</span>
                <a href="https://forms.gle/vjDsRcq8L724keTM7" target="_blank">お問い合わせ</a>
                <span class="mx-2">|</span>
                <a href="https://forms.gle/VVFdPDf6RpY6LEnu9" target="_blank" class="fw-bold text-danger">
                    <i class="fas fa-flag"></i> 抜け報告
                </a>
                <span class="mx-2">|</span>
                <a href="https://x.com/SPCollectionApp" target="_blank" class="text-decoration-none">
                    <i class="fab fa-x-twitter"></i>
                </a>
            </div>

            <small>© 2026 SP Colle</small>
            <small>※非公式ファンアプリです</small>

        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
