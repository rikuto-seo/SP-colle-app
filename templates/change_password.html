{% extends "base.html" %}

{% block title %}パスワード変更{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="card-title mb-4 text-center">パスワード変更</h3>

      <div id="errorMessage" class="alert alert-danger d-none"></div>
      <div id="successMessage" class="alert alert-success d-none"></div>

      <form id="passwordForm">
        <div class="mb-3">
          <label class="form-label">現在のパスワード</label>
          <input type="password" id="current_password" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">新しいパスワード</label>
          <input type="password" id="new_password" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">新しいパスワード（確認用）</label>
          <input type="password" id="confirm_password" class="form-control" required>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-100">
          変更する
        </button>
      </form>

      <a href="{{ url_for('user.mypage') }}" class="btn btn-secondary mt-3">← 戻る</a>

    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  EmailAuthProvider,
  reauthenticateWithCredential,
  updatePassword
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "sakamichi-photo-app.firebaseapp.com",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let currentUser = null;

// ==========================
// 認証チェック
// ==========================
onAuthStateChanged(auth, (user) => {
  if (!user) {
    alert("ログインしてください");
    window.location.href = "/login";
    return;
  }
  currentUser = user;
});


// ==========================
// エラーメッセージ
// ==========================
function showError(msg) {
  const div = document.getElementById("errorMessage");
  div.textContent = msg;
  div.classList.remove("d-none");
}

function showSuccess(msg) {
  const div = document.getElementById("successMessage");
  div.textContent = msg;
  div.classList.remove("d-none");
}


// ==========================
// パスワード変更処理
// ==========================
document.getElementById("passwordForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const currentPassword = document.getElementById("current_password").value;
  const newPassword = document.getElementById("new_password").value;
  const confirmPassword = document.getElementById("confirm_password").value;

  // UIリセット
  document.getElementById("errorMessage").classList.add("d-none");
  document.getElementById("successMessage").classList.add("d-none");

  if (!currentUser) {
    showError("認証状態が無効です");
    return;
  }

  if (newPassword.length < 6) {
    showError("パスワードは6文字以上にしてください");
    return;
  }

  if (newPassword !== confirmPassword) {
    showError("パスワードが一致しません");
    return;
  }

  try {
    // 🔐 再認証
    const credential = EmailAuthProvider.credential(
      currentUser.email,
      currentPassword
    );

    await reauthenticateWithCredential(currentUser, credential);

    // 🔁 パスワード更新
    await updatePassword(currentUser, newPassword);

    showSuccess("パスワードを変更しました");

    // フォームリセット
    document.getElementById("passwordForm").reset();

  } catch (err) {
    console.error(err);

    if (err.code === "auth/wrong-password") {
      showError("現在のパスワードが違います");
    } else if (err.code === "auth/too-many-requests") {
      showError("試行回数が多すぎます。しばらく待ってください");
    } else {
      showError("パスワード変更に失敗しました");
    }
  }
});
</script>

{% endblock %}
