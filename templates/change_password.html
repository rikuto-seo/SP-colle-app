{% extends "base.html" %}

{% block title %}パスワード変更{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="card-title mb-4 text-center">パスワード変更</h3>

      <form method="POST">
        <div class="mb-3">
          <label for="current_password" class="form-label">現在のパスワード</label>
          <input type="password" name="current_password" id="current_password" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="new_password" class="form-label">新しいパスワード</label>
          <input type="password" name="new_password" id="new_password" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="confirm_password" class="form-label">新しいパスワード（確認用）</label>
          <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">変更する</button>
      </form>

      <a href="{{ url_for('user.mypage') }}" class="btn btn-secondary mt-3">← 戻る</a>

    </div>
  </div>
</div>
{% endblock %}
