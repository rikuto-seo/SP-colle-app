{% extends "base.html" %}
{% block title %}チャット一覧{% endblock %}
{% block content %}
<h2>チャット一覧</h2>
<ul>
  {% for user in chat_partners %}
    <li><a href="{{ url_for('chat.chat_with', user_id=user.id) }}">{{ user.username }}</a></li>
  {% else %}
    <li>チャット相手がいません。</li>
  {% endfor %}
</ul>
{% endblock %}
