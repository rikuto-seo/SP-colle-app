{% extends "base.html" %}
{% block title %}ログイン処理中{% endblock %}

{% block content %}
<div class="container mt-5 text-center">
  <div class="card p-4 shadow-sm">
    <h3 id="statusText">ログイン処理中...</h3>
    <div class="spinner-border mt-3" role="status"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import {
    getAuth,
    isSignInWithEmailLink,
    signInWithEmailLink
  } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAJNWrQTo4R78rygPdugp6G7LXlJ0jggLo",
    authDomain: "sakamichi-photo-app.firebaseapp.com",
    projectId: "sakamichi-photo-app",
    storageBucket: "sakamichi-photo-app.appspot.com",
    messagingSenderId: "873667254289",
    appId: "1:873667254289:web:4441f862542e9c4c9bb9b0",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const statusText = document.getElementById("statusText");

  function showError(msg) {
    statusText.textContent = msg;
  }

  async function finishLogin() {
    try {
      // 🔍 メールリンク判定
      if (!isSignInWithEmailLink(auth, window.location.href)) {
        showError("無効なリンクです。");
        return;
      }

      // 📧 email取得
      let email = localStorage.getItem("emailForSignIn");

      if (!email) {
        email = window.prompt("登録したメールアドレスを入力してください");
      }

      if (!email) {
        showError("メールアドレスが必要です。");
        return;
      }

      // 🔐 Firebaseログイン
      const result = await signInWithEmailLink(auth, email, window.location.href);

      localStorage.removeItem("emailForSignIn");

      // 🎫 IDトークン取得
      const token = await result.user.getIdToken();

      // 🔗 サーバー同期
      const res = await fetch("/api/me", {
        method: "POST",
        credentials: "include",
        headers: {
          "Authorization": "Bearer " + token
        }
      });

      // 🔴 ここ重要：レスポンスチェック強化
      if (!res.ok) {
        const errText = await res.text();
        console.error("API ERROR:", errText);
        throw new Error("ログイン状態の取得に失敗しました");
      }

      const data = await res.json();

      // 🔴 安全チェック
      if (!data || data.status !== "ok") {
        throw new Error("ログイン状態が不正です");
      }

      // 🚀 分岐
      if (!data.is_setup_complete) {
        window.location.href = "/first-register";
      } else {
        window.location.href = "/";
      }

    } catch (err) {
      console.error("LOGIN ERROR:", err);

      showError(
        "ログインに失敗しました。\nもう一度やり直してください。"
      );
    }
  }

  finishLogin();
</script>
{% endblock %}
