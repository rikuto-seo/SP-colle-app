{% extends "base.html" %}
{% block title %}初回登録{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width:600px;">

  <div class="card p-4 shadow-sm">

    <h2 class="text-center mb-4">初回登録</h2>

    <div id="errorMessage" class="alert alert-danger d-none"></div>

    <!-- STEP1 -->
    <div id="step1">
      <h5 class="mb-3">ユーザー名とパスワードを入力</h5>

      <input type="text" id="username" class="form-control mb-3" placeholder="坂道太郎">

      <input type="password" id="password" class="form-control mb-3" placeholder="パスワード（6文字以上）">

      <input type="password" id="passwordConfirm" class="form-control mb-3" placeholder="パスワード確認">

      <div class="d-grid">
        <button id="toStep2" class="btn btn-primary">次へ</button>
      </div>
    </div>

    <!-- STEP2 -->
    <div id="step2" class="d-none">
      <h5 class="mb-3">アイコン設定</h5>

      <input type="file" id="iconInput" class="form-control mb-3">

      <div class="text-center mb-3">
        <img id="preview" style="max-width:200px; display:none;">
      </div>

      <div class="d-grid gap-2">
        <button id="uploadIcon" class="btn btn-success">保存して次へ</button>
        <button id="skipIcon" class="btn btn-secondary">スキップ</button>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  updatePassword,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAJNWrQTo4R78rygPdugp6G7LXlJ0jggLo",
  authDomain: "sakamichi-photo-app.firebaseapp.com",
  projectId: "sakamichi-photo-app",
  storageBucket: "sakamichi-photo-app.appspot.com",
  messagingSenderId: "873667254289",
  appId: "1:873667254289:web:4441f862542e9c4c9bb9b0",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 永続化（超重要）
await setPersistence(auth, browserLocalPersistence);

let idToken = null;
let currentUser = null;

// ==========================
// Firebase復元待ち（安定版）
// ==========================
function waitForAuth() {
  return new Promise((resolve, reject) => {
    const unsub = onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          currentUser = user;
          idToken = await user.getIdToken(true); // 常に最新
          unsub();
          resolve(user);
        } catch (e) {
          reject(e);
        }
      }
    });

    setTimeout(() => reject("auth timeout"), 10000);
  });
}

// ==========================
// ログインチェック
// ==========================
async function checkLogin() {
  try {
    await waitForAuth();

    const res = await fetch("/api/me", {
      method: "POST",
      credentials: "include",
      headers: {
        Authorization: "Bearer " + idToken
      }
    });

    const data = await res.json();

    if (!res.ok || data.status !== "ok") {
      throw new Error("auth failed");
    }

  } catch (err) {
    console.error("LOGIN CHECK ERROR:", err);
    alert("ログイン状態が無効です");
    window.location.href = "/login";
  }
}

await checkLogin();


// ==========================
// STEP1（ユーザー名 + パスワード）
// ==========================
document.getElementById("toStep2").addEventListener("click", async () => {

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("passwordConfirm").value;

  if (!username) {
    alert("ユーザー名を入力してください");
    return;
  }

  if (!password || password.length < 6) {
    alert("パスワードは6文字以上にしてください");
    return;
  }

  if (password !== confirm) {
    alert("パスワードが一致しません");
    return;
  }

  try {
    // 🔥 ここ修正：currentUserではなく保証済みuser
    if (!currentUser) {
      alert("認証状態が不正です。再ログインしてください");
      location.href = "/login";
      return;
    }

    // 🔐 パスワード設定
    await updatePassword(currentUser, password);

    // 🔁 トークン更新
    idToken = await currentUser.getIdToken(true);

    // 👤 ユーザー名保存
    const res = await fetch("/api/setup/username", {
      method: "POST",
      credentials: "include",
      headers: {
        "Authorization": "Bearer " + idToken,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ username })
    });

    if (!res.ok) {
      const text = await res.text();
      console.error(text);
      throw new Error("username save failed");
    }

    // UI遷移
    document.getElementById("step1").classList.add("d-none");
    document.getElementById("step2").classList.remove("d-none");

  } catch (err) {
    console.error("STEP1 ERROR:", err);

    if (err.code === "auth/requires-recent-login") {
      alert("セキュリティのため再ログインしてください");
      window.location.href = "/login";
      return;
    }

    alert("登録に失敗しました");
  }
});


// ==========================
// アイコン処理
// ==========================
const iconInput = document.getElementById("iconInput");
const preview = document.getElementById("preview");

let base64Image = null;

iconInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    preview.src = reader.result;
    preview.style.display = "block";
    base64Image = reader.result;
  };
  reader.readAsDataURL(file);
});

document.getElementById("uploadIcon").addEventListener("click", async () => {

  try {
    if (base64Image) {
      await fetch("/api/setup/icon", {
        method: "POST",
        credentials: "include",
        headers: {
          "Authorization": "Bearer " + idToken,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          image: base64Image
        })
      });
    }
  } catch (e) {
    console.error("ICON ERROR:", e);
  }

  window.location.href = "/select-group";
});

document.getElementById("skipIcon").addEventListener("click", () => {
  window.location.href = "/select-group";
});
</script>

{% endblock %}
