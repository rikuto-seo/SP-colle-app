{% extends "base.html" %}
{% block title %}フレンド申請一覧{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">受信したフレンド申請</h2>

  {% if requests %}
    <ul class="list-group">
      {% for req in requests %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <div class="d-flex align-items-center gap-2">
            <img src="{{ req.user.icon_url }}" style="width: 40px; height: 40px; object-fit: cover; border-radius: 50%;">
            <span>{{ req.user.username }}</span>
          </div>
          <div>
            <form action="{{ url_for('friend.approve_friend', friendship_id=req.id) }}" method="post" style="display:inline;">
              <button class="btn btn-sm btn-success"><i class="fas fa-check"></i> 承認</button>
            </form>
            <form action="{{ url_for('friend.reject_friend', friendship_id=req.id) }}" method="post" style="display:inline;">
              <button class="btn btn-sm btn-danger"><i class="fas fa-times"></i> 拒否</button>
            </form>
          </div>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="text-muted">現在、受信中のフレンド申請はありません。</p>
  {% endif %}
</div>

<a href="{{ url_for('friend.friend_list') }}" class="btn btn-secondary mt-3">
  ← 戻る
</a>

{% endblock %}
