{% extends "base.html" %}

{% block title %}アイコン設定{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 600px;">
  <h1>アイコン設定</h1>

  <form method="post" enctype="multipart/form-data">
    {{ form.hidden_tag() }}

    <div class="mb-3">
      {{ form.icon.label(class="form-label") }}
      {{ form.icon(class="form-control", id="icon-input") }}
    </div>

    <div class="mb-3">
      <label class="form-label">トリミングプレビュー</label>
      <img id="cropper-image" style="max-width: 100%; display: none;">
    </div>

    <!-- トリミングされた画像を送る hidden input -->
    <input type="hidden" name="cropped_data" id="cropped-data">

    <button type="submit" class="btn btn-primary">アップロード</button>
  </form>

  <a href="{{ url_for('mypage') }}" class="btn btn-secondary mt-3">← 戻る</a>
</div>

<!-- 🔥 削除ボタンを別フォームで追加 -->
<form method="post" action="{{ url_for('delete_icon') }}">
  <button type="submit" class="btn btn-danger mt-3" onclick="return confirm('本当に削除しますか？')">アイコンを削除</button>
</form>

<!-- JavaScript -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const iconInput = document.getElementById('icon-input');
  const cropperImage = document.getElementById('cropper-image');
  const croppedDataInput = document.getElementById('cropped-data');
  let cropper;

  iconInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      cropperImage.src = event.target.result;
      cropperImage.style.display = 'block';

      if (cropper) {
        cropper.destroy();
      }

      cropper = new Cropper(cropperImage, {
        aspectRatio: 1,
        viewMode: 1,
        autoCropArea: 1,
        responsive: true,
        background: false
      });
    };
    reader.readAsDataURL(file);
  });

  const form = document.querySelector('form');
  form.addEventListener('submit', (e) => {
    if (cropper) {
      const canvas = cropper.getCroppedCanvas({ width: 256, height: 256 });
      croppedDataInput.value = canvas.toDataURL('image/png');
    }
  });
});
</script>
{% endblock %}
