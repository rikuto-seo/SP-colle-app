{% extends "base.html" %}
{% block title %}ログイン{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow p-4">
        <h2 class="text-center mb-4">ログイン</h2>

        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">メールアドレス</label>
            <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">パスワード</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>
          <div class="d-grid">
            <button type="submit" id="loginBtn" class="btn btn-primary">
              <span id="loginText">ログイン</span>
              <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
          </div>
        </form>
        <div class="mt-3 text-center">
          <a href="/register" class="text-decoration-none">アカウントを新規作成</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAJNWrQTo4R78rygPdugp6G7LXlJ0jggLo",
    authDomain: "sakamichi-photo-app.firebaseapp.com",
    projectId: "sakamichi-photo-app",
    storageBucket: "sakamichi-photo-app.appspot.com",
    messagingSenderId: "873667254289",
    appId: "1:873667254289:web:4441f862542e9c4c9bb9b0",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  function getJapaneseMessage(errorCode) {
    switch (errorCode) {
      case "auth/invalid-email":
        return "メールアドレスの形式が正しくありません。";
      case "auth/user-disabled":
        return "このアカウントは無効化されています。";
      case "auth/user-not-found":
        return "アカウントが見つかりません。";
      case "auth/wrong-password":
        return "パスワードが間違っています。";
      case "auth/invalid-credential":
        return "メールアドレスまたはパスワードが正しくありません。"; // 最近のFirebaseはこのエラーに統合されています
      case "auth/too-many-requests":
        return "何度も失敗したため、一時的にロックされました。時間を置いて試してください。";
      default:
        return "ログインに失敗しました。入力内容を確認してください。";
    }
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const btn = document.getElementById("loginBtn");

    if (btn.disabled) return; 
    
    const loginText = document.getElementById("loginText");
    const loginSpinner = document.getElementById("loginSpinner");
    const errorDiv = document.getElementById("errorMessage");

    errorDiv.classList.add("d-none");
    loginText.textContent = "ログイン中...";
    loginSpinner.classList.remove("d-none");

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      const userCredential = await signInWithEmailAndPassword(auth, email, password);
      const token = await userCredential.user.getIdToken();

      const res = await fetch("/api/me", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token
        }
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || "ログイン処理に失敗しました");
      }

      const data = await res.json();

      if (!data.is_setup_complete) {
        window.location.href = "/first-register";
      } else {
        window.location.href = "/";
      }

      errorDiv.textContent = getJapaneseMessage(err.code) || err.message;
      errorDiv.classList.remove("d-none");

      btn.disabled = false;
      loginText.textContent = "ログイン";
      loginSpinner.classList.add("d-none");
    }
  });
</script>
{% endblock %}
