{% extends "base.html" %}

{% block title %}ユーザー登録{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card p-4 shadow-sm" style="max-width: 500px; margin: 0 auto;">
        <h2 class="text-center mb-4">ユーザー登録</h2>
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label for="username" class="form-label">ユーザー名</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="ユーザー名を入力" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">パスワード</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="パスワードを入力" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">登録する</button>
            </div>
        </form>
        <div class="mt-3 text-center">
            <a href="{{ url_for('login') }}">すでにアカウントをお持ちの方はこちら</a>
        </div>
    </div>
</div>
{% endblock %}
