{% extends "base.html" %}
{% block title %}ユーザー登録{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="card p-4 shadow-sm" style="max-width: 500px; margin: 0 auto;">
    <h2 class="text-center mb-4">ユーザー登録</h2>

    <div id="successMessage" class="alert alert-success d-none" role="alert"></div>
    <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label">メールアドレス</label>
        <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
      </div>

      <div class="d-grid">
        <button type="submit" id="registerBtn" class="btn btn-primary">
          <span id="registerText">登録用リンクを送信</span>
          <span id="registerSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </div>
    </form>

    <div class="mt-3 text-center">
      <a href="/login" class="text-decoration-none">ログインはこちら</a>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
  import { getAuth, sendSignInLinkToEmail } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAJNWrQTo4R78rygPdugp6G7LXlJ0jggLo",
    authDomain: "sakamichi-photo-app.firebaseapp.com",
    projectId: "sakamichi-photo-app",
    storageBucket: "sakamichi-photo-app.appspot.com",
    messagingSenderId: "873667254289",
    appId: "1:873667254289:web:4441f862542e9c4c9bb9b0",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  function getJapaneseErrorMessage(errorCode) {
    switch (errorCode) {
      case "auth/invalid-email":
        return "メールアドレスの形式が正しくありません。";
      case "auth/missing-email":
        return "メールアドレスを入力してください。";
      case "auth/too-many-requests":
        return "リクエストが多すぎます。しばらく待ってください。";
      default:
        return "送信に失敗しました。もう一度お試しください。";
    }
  }

  document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const btn = document.getElementById("registerBtn");
    const text = document.getElementById("registerText");
    const spinner = document.getElementById("registerSpinner");
    const errorDiv = document.getElementById("errorMessage");
    const successDiv = document.getElementById("successMessage");

    errorDiv.classList.add("d-none");
    successDiv.classList.add("d-none");

    btn.disabled = true;
    text.textContent = "送信中...";
    spinner.classList.remove("d-none");

    const email = document.getElementById("email").value;

    try {
      const actionCodeSettings = {
        url: "https://spcolle.com/finish-login",
        handleCodeInApp: true,
      };

      await sendSignInLinkToEmail(auth, email, actionCodeSettings);

      localStorage.setItem("emailForSignIn", email);

      successDiv.textContent = "登録用リンクをメールに送信しました。メールをご確認ください。";
      successDiv.classList.remove("d-none");

      document.getElementById("registerForm").reset();

    } catch (err) {
      console.error(err);

      errorDiv.textContent = getJapaneseErrorMessage(err.code);
      errorDiv.classList.remove("d-none");

    } finally {
      btn.disabled = false;
      text.textContent = "登録用リンクを送信";
      spinner.classList.add("d-none");
    }
  });
</script>
{% endblock %}
