{% extends "base.html" %}

{% block head %}
  {{ super() }}
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
  <style>
    select.form-select {
      font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
      min-width: 150px;
    }
  </style>
{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 400px;">
  <h2 class="mb-4">初期表示グループの設定</h2>

  {% set group_names = {
    'nogizaka': '乃木坂46',
    'sakurazaka': '櫻坂46',
    'hinatazaka': '日向坂46'
  } %}

  <form method="post" class="mb-3">
     
    <div class="mb-3">
      <label for="group-select" class="form-label">グループを選択してください</label>
      <select name="group" id="group-select" class="form-select">
        {% for group in groups %}
          <option value="{{ group }}" {% if group == current_default %}selected{% endif %}>
            {{ group_names[group] }}
          </option>
        {% endfor %}
      </select>
    </div>
    <button type="submit" class="btn btn-primary">設定を保存</button>
  </form>
</div>
<a href="{{ url_for('mypage') }}" class="btn btn-secondary mt-3">
  ← 戻る
</a>
{% endblock %}
