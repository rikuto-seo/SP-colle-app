{% extends "base.html" %}
{% block title %}{{ username }}さんのコレクション（非公開）{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="text-center mb-4">
    <h2 class="display-6 fw-bold text-dark">{{ username }}さんのコレクション</h2>
  </div>

  <div class="card shadow-sm border-warning">
    <div class="card-body text-center">
      <i class="fa-solid fa-lock fa-3x text-warning mb-3"></i>
      <h4 class="card-title text-warning">このコレクションは非公開です</h4>
      <p class="card-text text-muted">
        所有者がこのコレクションを非公開にしているため、内容は表示できません。
      </p>
    </div>
  </div>
</div>
{% endblock %}
