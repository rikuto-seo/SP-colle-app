{% extends "base.html" %}
{% block content %}

{% set group_names = {
'nogizaka': '乃木坂46',
'sakurazaka': '櫻坂46',
'hinatazaka': '日向坂46'
} %}

<div class="container mt-5" style="max-width: 500px;">

  <div class="text-center mb-4">
    <h2 class="fw-bold section-title p-2 rounded">
      欲しい生写真を追加
    </h2>
    <p class="text-muted small">
      {{ group_names.get(group_key, group_key) }} の欲しい生写真を登録します
    </p>
  </div>

  <input type="hidden" id="group_key" value="{{ group_key }}">

  <div class="card shadow-sm">
    <div class="card-body">

      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- メンバー -->
        <div class="mb-3">
          <label class="form-label fw-bold">メンバー</label>
          <select name="member" id="member"></select>
        </div>

        <!-- 衣装 -->
        <div class="mb-3">
          <label class="form-label fw-bold">衣装</label>
          <select name="costume" id="costume"></select>
        </div>

        <!-- 種類 -->
        <div class="mb-3">
          <label class="form-label fw-bold">種類</label>
          <select name="photo_type" id="photo_type"></select>
        </div>

        <!-- 無限回収 -->
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" name="is_infinite" id="infinite">
          <label class="form-check-label fw-bold">
            無限回収（メンバーのみで全対象）
          </label>
        </div>

        <button type="submit" class="btn btn-success w-100 fw-bold">
          ＋ 追加する
        </button>

      </form>

    </div>
  </div>

  <div class="text-center mt-3">
    <button onclick="history.back()" class="btn btn-outline-secondary btn-sm">
      ← 戻る
    </button>
  </div>

</div>

<style>
.section-title {
  background-color: var(--bs-secondary-bg);
  color: var(--bs-body-color);
}
</style>

<!-- Tom Select -->
<link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const groupKey = document.getElementById('group_key').value;

  const ANY_OPTION = { value: "", text: "指定しない（すべて）" };

  // =========================
  // TomSelect初期化
  // =========================
  const memberTS = new TomSelect("#member", {
    create: false,
    maxItems: 1,
    placeholder: "指定しない（すべて）"
  });

  const costumeTS = new TomSelect("#costume", {
    create: false,
    maxItems: 1,
    placeholder: "指定しない（すべて）"
  });

  const typeTS = new TomSelect("#photo_type", {
    create: false,
    maxItems: 1,
    placeholder: "指定しない（すべて）"
  });

  // =========================
  // メンバー取得
  // =========================
  fetch(`/get_members?group=${encodeURIComponent(groupKey)}`)
    .then(res => res.json())
    .then(data => {

      memberTS.clearOptions();
      memberTS.addOption(ANY_OPTION);

      data.members.forEach(m => {
        memberTS.addOption({ value: m, text: m });
      });

      memberTS.refreshOptions(false);
    });

  // =========================
  // 衣装取得（memberなしでも取得）
  // =========================
  memberTS.on("change", (member) => {

    costumeTS.clear();
    costumeTS.clearOptions();

    fetch(`/get_costumes?group=${encodeURIComponent(groupKey)}&member=${encodeURIComponent(member || "")}`)
      .then(res => res.json())
      .then(data => {

        costumeTS.addOption(ANY_OPTION);

        data.costumes.forEach(c => {
          costumeTS.addOption({ value: c, text: c });
        });

        costumeTS.refreshOptions(false);
      })
      .catch(err => {
        console.error("衣装取得失敗", err);
      });
  });

  // =========================
  // 種類取得（完全独立）
  // =========================
  costumeTS.on("change", (costume) => {

    typeTS.clear();
    typeTS.clearOptions();

    fetch(`/get_types?group=${encodeURIComponent(groupKey)}&member=${encodeURIComponent(memberTS.getValue() || "")}&costume=${encodeURIComponent(costume || "")}`)
      .then(res => res.json())
      .then(data => {

        const TYPE_LABEL_MAP = {
          "04": "ヨリ",
          "05": "チュウ",
          "06": "ヒキ"
        };

        typeTS.addOption(ANY_OPTION);

        data.types.forEach(t => {
          typeTS.addOption({
            value: t,
            text: TYPE_LABEL_MAP[t] || t
          });
        });

        typeTS.refreshOptions(false);
      })
      .catch(err => {
        console.error("type取得失敗", err);
      });
  });

  // =========================
  // 無限回収チェック時
  // =========================
  document.getElementById("infinite").addEventListener("change", (e) => {
    if (e.target.checked) {
      costumeTS.clear();
      typeTS.clear();
    }
  });

});
</script>

{% endblock %}
