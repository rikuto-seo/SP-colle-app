{% extends "base.html" %}
{% block content %}

<h2>欲しい写真を追加（{{ group_key }}）</h2>

<input type="hidden" id="group_key" value="{{ group_key }}">

<form method="POST">
  <div class="mb-3">
    <label class="form-label">メンバー</label>
    <select name="member" id="member" class="form-select" required>
      <option value="">選択してください</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">衣装</label>
    <select name="costume" id="costume" class="form-select" required>
      <option value="">選択してください</option>
    </select>
  </div>

  <div class="mb-3">
    <label class="form-label">種類</label>
    <select name="photo_type" id="photo_type" class="form-select" required>
      <option value="">選択してください</option>
      <option value="ヨリ">ヨリ</option>
      <option value="チュウ">チュウ</option>
      <option value="ヒキ">ヒキ</option>
      <option value="座り">座り</option>
    </select>
  </div>

  <button type="submit" class="btn btn-primary w-100">
    追加
  </button>
</form>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const groupKey = document.getElementById('group_key').value;
  const memberSelect = document.getElementById('member');
  const costumeSelect = document.getElementById('costume');

  // メンバー取得
  fetch(`/get_members?group=${encodeURIComponent(groupKey)}`)
    .then(res => res.json())
    .then(data => {
      data.members.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        memberSelect.appendChild(opt);
      });
    });

  // メンバー選択 → 衣装取得
  memberSelect.addEventListener('change', () => {
    costumeSelect.innerHTML = '<option value="">選択してください</option>';

    if (!memberSelect.value) return;

    fetch(`/get_costumes?group=${encodeURIComponent(groupKey)}&member=${encodeURIComponent(memberSelect.value)}`)
      .then(res => res.json())
      .then(data => {
        data.costumes.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c;
          opt.textContent = c;
          costumeSelect.appendChild(opt);
        });
      });
  });
});
</script>

{% endblock %}
