<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}欲しい生写真一覧{% endblock %}</title>

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="{{ group_color }}">

    <!-- ヘッダー（簡易・固定） -->
    <div class="{% if group_key == 'hinatazaka' %}navbar-hinata
        {% elif group_key == 'sakurazaka' %}navbar-sakura
        {% elif group_key == 'nogizaka' %}navbar-nogi
        {% else %}navbar-default{% endif %}
        p-3 text-center">

        <div style="font-size: 20px; font-weight: bold;">
            坂道グループ 生写真アプリ
        </div>
        <div class="text-muted small">
            公開ページ（閲覧専用）
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="container mt-4 {{ group_color }}">
        {% block content %}
        {% endblock %}
    </div>

    <!-- フッター -->
    <footer class="text-center text-muted mt-5 mb-3 small">
        このページは公開用URLです。編集や登録はできません。
    </footer>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
